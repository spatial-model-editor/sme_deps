name: Release Builds
on: push
env:
  DUNE_COPASI_VERSION: "msvc"
  # temporary git redirects as gitlab.dune-project.org seems to be blocking github CI runners:
  GIT_CONFIG_COUNT: 6
  GIT_CONFIG_KEY_0: "url.https://github.com/dune-project/.insteadOf"
  GIT_CONFIG_VALUE_0: "https://gitlab.dune-project.org/core/"
  GIT_CONFIG_KEY_1: "url.https://github.com/dune-project/.insteadOf"
  GIT_CONFIG_VALUE_1: "https://gitlab.dune-project.org/staging/"
  GIT_CONFIG_KEY_2: "url.https://github.com/spatial-model-editor/dune-pdelab.git.insteadOf"
  GIT_CONFIG_VALUE_2: "https://gitlab.dune-project.org/pdelab/dune-pdelab.git"
  GIT_CONFIG_KEY_3: "url.https://github.com/spatial-model-editor/dune-multidomaingrid.git.insteadOf"
  GIT_CONFIG_VALUE_3: "https://gitlab.dune-project.org/extensions/dune-multidomaingrid.git"
  GIT_CONFIG_KEY_4: "url.https://github.com/spatial-model-editor/dune-multidomaingrid.git.insteadOf"
  GIT_CONFIG_VALUE_4: "https://gitlab.dune-project.org/liam.keegan/dune-multidomaingrid.git"
  GIT_CONFIG_KEY_5: "url.https://github.com/dune-copasi/dune-copasi.git.insteadOf"
  GIT_CONFIG_VALUE_5: "https://gitlab.dune-project.org/copasi/dune-copasi.git"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-22.04"
            shell: "bash"
          - os: "ubuntu-22.04"
            shell: "bash"
            BUILD_TAG: "_tsan"
          - os: "ubuntu-22.04-arm"
            shell: "bash"
          - os: "macos-26"
            shell: "bash"
          - os: "windows-2022"
            shell: "pwsh"
          - os: "windows-11-arm"
            shell: "pwsh"
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      BUILD_TAG: ${{ matrix.BUILD_TAG }}
    steps:
      - uses: spatial-model-editor/setup-ci@2026.10.02
        with:
          sme_deps_common: "2026.10.05"
          build_tag: ${{ matrix.BUILD_TAG }}
          cache_id: ${{ matrix.BUILD_TAG }}
      - uses: actions/checkout@v7
      - name: Build script
        if: runner.os != 'Windows'
        run: ./build.sh
      - name: Build script
        if: runner.os == 'Windows'
        run: ./build.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}${{ matrix.BUILD_TAG }}
          path: ./artefacts/*
          retention-days: 3
  release:
    name: Upload Binaries to GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    # upload binaries to github release if commit is tagged
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          repo: spatial-model-editor/sme_deps
          keep_latest: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: binaries
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: binaries/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
